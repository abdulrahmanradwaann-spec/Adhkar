<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B4332;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D2818;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F4E4A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F4E4A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="90" ry="90"/>
    </clipPath>
  </defs>
  
  <!-- Background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="90" ry="90" fill="url(#bgGrad)"/>
  
  <!-- Subtle pattern overlay -->
  <g clip-path="url(#squircle)" opacity="0.05">
    <circle cx="256" cy="256" r="200" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
    <circle cx="256" cy="256" r="180" fill="none" stroke="#D4AF37" stroke-width="0.3"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="#D4AF37" stroke-width="0.3"/>
  </g>
  
  <!-- Outer arch frame -->
  <path d="M 100 420 
           Q 100 280 120 220 
           Q 140 160 180 120 
           Q 220 80 256 60 
           Q 292 80 332 120 
           Q 372 160 392 220 
           Q 412 280 412 420 
           L 412 430 
           Q 412 450 392 450 
           L 120 450 
           Q 100 450 100 430 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Inner arch frame -->
  <path d="M 120 410 
           Q 120 290 138 235 
           Q 155 180 190 145 
           Q 225 110 256 95 
           Q 287 110 322 145 
           Q 357 180 374 235 
           Q 392 290 392 410 
           L 392 420 
           Q 392 435 378 435 
           L 134 435 
           Q 120 435 120 420 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Crescent moon and star -->
  <g transform="translate(256, 150)" filter="url(#glow)">
    <circle cx="0" cy="0" r="22" fill="url(#goldGrad2)"/>
    <circle cx="8" cy="-4" r="18" fill="#1B4332"/>
    <polygon points="20,-8 23,-1 30,-1 24,4 26,12 20,7 14,12 16,4 10,-1 17,-1" fill="url(#goldGrad2)"/>
  </g>
  
  <!-- Main text أذكاري -->
  <text x="256" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="url(#goldGrad)" filter="url(#glow)">أذكاري</text>
  
  <!-- Open Quran at bottom -->
  <g transform="translate(256, 380)" filter="url(#glow)">
    <!-- Book spine -->
    <path d="M -40 10 Q -40 -5 0 -10 Q 40 -5 40 10" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- Left page -->
    <path d="M -40 10 Q -40 -5 0 -10 L 0 15 Z" fill="#D4AF37" opacity="0.3"/>
    <!-- Right page -->
    <path d="M 40 10 Q 40 -5 0 -10 L 0 15 Z" fill="#D4AF37" opacity="0.3"/>
    <!-- Page lines -->
    <line x1="-30" y1="0" x2="-5" y2="-5" stroke="#F4E4A0" stroke-width="1" opacity="0.5"/>
    <line x1="-28" y1="5" x2="-5" y2="0" stroke="#F4E4A0" stroke-width="1" opacity="0.5"/>
    <line x1="30" y1="0" x2="5" y2="-5" stroke="#F4E4A0" stroke-width="1" opacity="0.5"/>
    <line x1="28" y1="5" x2="5" y2="0" stroke="#F4E4A0" stroke-width="1" opacity="0.5"/>
  </g>
  
  <!-- Olive branches left -->
  <g transform="translate(130, 370)" opacity="0.6">
    <path d="M 0 0 Q -20 -30 -10 -60 Q 0 -80 10 -60 Q 20 -30 0 0" fill="none" stroke="#2D5A3D" stroke-width="2"/>
    <ellipse cx="-8" cy="-20" rx="6" ry="10" fill="#2D5A3D" transform="rotate(-20 -8 -20)"/>
    <ellipse cx="5" cy="-35" rx="5" ry="9" fill="#2D5A3D" transform="rotate(15 5 -35)"/>
    <ellipse cx="-3" cy="-50" rx="5" ry="8" fill="#2D5A3D" transform="rotate(-10 -3 -50)"/>
  </g>
  
  <!-- Olive branches right -->
  <g transform="translate(382, 370)" opacity="0.6">
    <path d="M 0 0 Q 20 -30 10 -60 Q 0 -80 -10 -60 Q -20 -30 0 0" fill="none" stroke="#2D5A3D" stroke-width="2"/>
    <ellipse cx="8" cy="-20" rx="6" ry="10" fill="#2D5A3D" transform="rotate(20 8 -20)"/>
    <ellipse cx="-5" cy="-35" rx="5" ry="9" fill="#2D5A3D" transform="rotate(-15 -5 -35)"/>
    <ellipse cx="3" cy="-50" rx="5" ry="8" fill="#2D5A3D" transform="rotate(10 3 -50)"/>
  </g>
  
  <!-- 2026 text -->
  <text x="256" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="url(#goldGrad)" letter-spacing="4">2026</text>
  
  <!-- Decorative corner elements -->
  <circle cx="120" cy="120" r="4" fill="#D4AF37" opacity="0.4"/>
  <circle cx="392" cy="120" r="4" fill="#D4AF37" opacity="0.4"/>
  <circle cx="120" cy="392" r="4" fill="#D4AF37" opacity="0.4"/>
  <circle cx="392" cy="392" r="4" fill="#D4AF37" opacity="0.4"/>
</svg>